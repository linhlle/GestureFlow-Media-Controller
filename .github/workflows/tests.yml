name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the code targets; 3.12 catches anything that only
        # works on the old one.
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node
        # Only the numeric JS/Python parity tests need it; they skip without it,
        # and skipping silently is exactly what should not happen in CI.
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,train]"

      - name: Run tests
        run: |
          pytest --cov=gestureflow --cov-report=term-missing \
                 --cov-report=xml -q

      - name: Check the JS parity tests actually ran
        # These skip when Node is missing. A silent skip would let the browser
        # recognizer drift from the desktop one without CI noticing, which is
        # the entire failure mode they exist to prevent.
        run: |
          pytest tests/test_js_parity.py -q --no-header -rs 2>&1 | tee out.txt
          if grep -q "skipped" out.txt; then
            echo "::error::JS parity tests were skipped; they must run in CI"
            exit 1
          fi

      - name: Validate the shipped command config
        run: python -m gestureflow validate --commands configs/commands.default.yaml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check gestureflow scripts tests

      - name: Check the web build is self-consistent
        run: |
          python -m pip install -e ".[dev,train]"
          pytest tests/test_web_parity.py -q
