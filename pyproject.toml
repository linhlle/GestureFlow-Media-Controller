[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestureflow"
version = "0.2.0"
description = "Real-time hand-gesture control for macOS"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Linh Le" }]
requires-python = ">=3.9"
keywords = ["gesture", "mediapipe", "computer-vision", "macos", "accessibility"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]

dependencies = [
    "mediapipe>=0.10,<0.11",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyAutoGUI>=0.9.54",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Everything needed to collect data and retrain.
train = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "pandas>=2.0",
]

[project.scripts]
gestureflow = "gestureflow.cli:main"

[project.urls]
Homepage = "https://github.com/linhlle/GestureFlow-Media-Controller"
Issues = "https://github.com/linhlle/GestureFlow-Media-Controller/issues"

[tool.setuptools]
packages = ["gestureflow"]

[tool.setuptools.package-data]
gestureflow = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importmode=importlib keeps tests importable without __init__.py files and
# without depending on the working directory.
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "-ra",
]
filterwarnings = [
    # sklearn warns when predicting from a bare array rather than a DataFrame.
    # The pipeline deliberately passes arrays -- building a DataFrame per frame
    # would cost more than the prediction.
    "ignore:X does not have valid feature names:UserWarning",
]
markers = [
    "slow: takes more than a second",
]

[tool.coverage.run]
source = ["gestureflow"]
omit = [
    # Requires a camera, a display, and macOS APIs; exercised by hand, not in CI.
    "gestureflow/app.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
